<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Simulator</title>
    <style>
        body {
            background-color: #0c0202;
            color: #fce8e6;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #160404;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 25px rgba(255, 0, 0, 0.35);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid #4a0d0d;
        }
        h1 {
            color: #ff2a2a;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 8px rgba(255, 42, 42, 0.6);
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 14px;
            color: #d18a8a;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background-color: #070101;
            border: 1px solid #571515;
            color: #ff9e9e;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 5px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #ff2a2a;
        }
        button {
            background-color: #800000;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s, box-shadow 0.3s;
            width: 100%;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(128, 0, 0, 0.5);
        }
        button:hover {
            background-color: #a80000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }
        #output {
            background-color: #080101;
            padding: 15px;
            border-radius: 5px;
            min-height: 120px;
            text-align: left;
            font-size: 14px;
            white-space: pre-line;
            border: 1px solid #421010;
            color: #ff6b6b;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>NEET Simulator</h1>
        <div class="input-group">
            <label for="trialInput">Enter number of trial runs:</label>
            <input type="number" id="trialInput" min="1" max="50" value="5">
        </div>
        <button onclick="runSimulation()">Attempt Counseling</button>
        <div id="output">Enter trials and press the button to check your allotment status...</div>
    </div>

    <script>
        const deathMessages = [
            "User will never see a medical college campus again.",
            "User's drop year continues, but user's sanity keeps fading.",
            "User is torn apart by NTA's unexpected rank inflation.",
            "User's cutoff is sealed, and user can't escape the general category trap.",
            "The pain is overwhelming as user recalculates chemistry marks.",
            "User's soul is ripped from user's body, leaving behind only NCERT textbooks.",
            "User is thrown into the drop-year abyss, never to return to college.",
            "User is crushed by an invisible cutoff rank, leaving just a low percentile.",
            "User's physics numericals are torn to shreds, piece by piece.",
            "User is engulfed by a counseling black hole, pulled into private college fee structures.",
            "User is electrocuted by high-yield organic chemistry exceptions, sparks flying in every direction.",
            "User's hopes of a white coat are violently pulled away, leaving a mess.",
            "User is impaled by a sharp, unseen negative marking penalty, tearing through user's total score.",
            "User is suffocated by parental expectations, choking on air that isn't there.",
            "User is burned by mock test burnout user can't fix, user's motivation melting away.",
            "User is frozen solid, turned to ice by an unexpected physics section B.",
            "User is disintegrated by an invisible normalization formula.",
            "User is impaled by a difficult biology statement-based question, slicing through user's rank.",
            "User is crushed by a falling drop-year attempt counter, user's mental peace shattered.",
            "User is drowned in a sea of previous year question papers, user's heart stopping in the process.",
            "User is electrocuted by a sudden exam pattern change, user's body convulsing violently.",
            "User is crushed by a massive syllabus weight, user's memory and stamina compressed.",
            "User is torn apart by counseling rounds, each choice locking in different directions.",
            "User is impaled by a missed seat allotment by 0.5 marks, user's dreams pinned to the ground."
        ];

        function runSimulation() {
            let inputVal = document.getElementById("trialInput").value;
            let numAttempts = parseInt(inputVal);

            if (isNaN(numAttempts) || numAttempts < 1) {
                numAttempts = 1;
            } else if (numAttempts > 50) {
                numAttempts = 50; 
            }

            let outputText = `Target Trials: ${numAttempts}\n\n`;

            for (let attempt = 0; attempt <= numAttempts; attempt++) {
                outputText += `Trial ${attempt}\n`;
            }

            let finalMessage = deathMessages[Math.floor(Math.random() * deathMessages.length)];
            outputText += `\n${finalMessage}`;

            document.getElementById("output").innerText = outputText;
        }
    </script>

</body>
</html>
